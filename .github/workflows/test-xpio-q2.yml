name: Test XPIO Q2

on:
  pull_request:
    paths:
      - "prototype/xpio/**"
      - "schemas/p011-xpio-*.json"
      - "config/p011-xpio-001.yaml"
      - "manifests/P011-XPIO-001.*.json"
      - ".github/workflows/test-xpio-q2.yml"
  push:
    branches: [main]
    paths:
      - "prototype/xpio/**"
      - "schemas/p011-xpio-*.json"
      - "config/p011-xpio-001.yaml"
      - "manifests/P011-XPIO-001.*.json"
      - ".github/workflows/test-xpio-q2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        working-directory: prototype/xpio
        run: python -m unittest -v test_xpio_control_plane.py
      - name: Install schema validators
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.22,<5" "PyYAML>=6,<7"
      - name: Validate schemas and examples
        run: |
          python - <<'PY'
          import json, yaml
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root=Path('.')
          pairs=[
            ('schemas/p011-xpio-work-packet.schema.json','manifests/P011-XPIO-001.sample-work-packet.json'),
            ('schemas/p011-xpio-identity-passport.schema.json','manifests/P011-XPIO-001.sample-identity-passport.json'),
          ]
          for schema_path, example_path in pairs:
              schema=json.loads((root/schema_path).read_text())
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(json.loads((root/example_path).read_text()))
          Draft202012Validator.check_schema(json.loads((root/'schemas/p011-xpio-transparency-event.schema.json').read_text()))
          config=yaml.safe_load((root/'config/p011-xpio-001.yaml').read_text())
          assert config['module_id']=='P-011-XPIO-001'
          print('XPIO schema and configuration validation passed')
          PY
