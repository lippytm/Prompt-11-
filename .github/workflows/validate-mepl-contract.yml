name: Validate MEPL Contract

on:
  pull_request:
    paths:
      - "docs/P011-MEPL-001-master-evidence-product-ledger-data-model.md"
      - "config/p011-mepl-001-data-model.yaml"
      - "schemas/p011-mepl-manifest.schema.json"
      - "examples/P011-MEPL-001.manifest.example.json"
      - "scripts/validate_mepl_contract.py"
      - ".github/workflows/validate-mepl-contract.yml"
  push:
    branches:
      - main
    paths:
      - "docs/P011-MEPL-001-master-evidence-product-ledger-data-model.md"
      - "config/p011-mepl-001-data-model.yaml"
      - "schemas/p011-mepl-manifest.schema.json"
      - "examples/P011-MEPL-001.manifest.example.json"
      - "scripts/validate_mepl_contract.py"
      - ".github/workflows/validate-mepl-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate schema, example, and YAML contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.22,<5" "PyYAML>=6,<7"

      - name: Run MEPL contract validation
        run: python scripts/validate_mepl_contract.py
