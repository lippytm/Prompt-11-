name: Test Prompt 11 CRM Q2

on:
  pull_request:
    paths:
      - "prototype/crm/**"
      - "schemas/p011-crm-*.json"
      - "config/p011-crm-001.yaml"
      - "examples/P011-CRM-001.*.json"
      - ".github/workflows/test-crm-q2.yml"
  push:
    branches: [main]
    paths:
      - "prototype/crm/**"
      - "schemas/p011-crm-*.json"
      - "config/p011-crm-001.yaml"
      - "examples/P011-CRM-001.*.json"
      - ".github/workflows/test-crm-q2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run compact CRM contract smoke tests
        working-directory: prototype/crm
        run: python -m unittest -v test_crm_contract_smoke.py
      - name: Install validators
        run: python -m pip install --disable-pip-version-check "jsonschema>=4.22,<5" "PyYAML>=6,<7"
      - name: Validate CRM contracts
        run: |
          python - <<'PY2'
          import json, yaml
          from pathlib import Path
          from jsonschema import Draft202012Validator
          root=Path('.')
          pairs=[
            ('schemas/p011-crm-party-passport.schema.json','examples/P011-CRM-001.sample-party.json'),
            ('schemas/p011-crm-consent-record.schema.json','examples/P011-CRM-001.sample-consent.json'),
            ('schemas/p011-crm-audit-event.schema.json','examples/P011-CRM-001.sample-audit-event.json'),
          ]
          for schema_path, example_path in pairs:
              schema=json.loads((root/schema_path).read_text())
              Draft202012Validator.check_schema(schema)
              Draft202012Validator(schema).validate(json.loads((root/example_path).read_text()))
          config=yaml.safe_load((root/'config/p011-crm-001.yaml').read_text())
          assert config['module_id']=='P-011-CRM-001'
          assert config['release_rules']['human_approval_required'] is True
          print('CRM contracts validated')
          PY2
