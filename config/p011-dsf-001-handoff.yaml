mirror_rule: Mirrors reference the canonical module version and may not silently change factual claims.

human_review:
  required_for:
    - publication
    - named allegations
    - medical explanations
    - legal conclusions
    - blockchain minting
    - affiliate claims
    - handling confidential or restricted data
