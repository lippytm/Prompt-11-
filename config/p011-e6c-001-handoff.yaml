quantum_questions:
  IF: define testable consequences, assumptions, affected parties and required evidence
  MAYBE: generate competing explanations, uncertainty and disconfirming evidence
  WHY_NOT: design constructive projects, reforms, stories, businesses and regenerative alternatives
  DONT_DO_THAT: block unsafe, unlawful, deceptive, coercive, exploitative or irreversible actions

