schema_version: "0.1.0"
module:
  id: P-011-MEPL-001
  name: "$7 Prompt #11 Master Evidence and Product Ledger"
  parent: P-011-OMNI-001
  related_modules:
    - P-011-EEBDS-001
    - P-011-E6C-001
    - P-011-E6C-CHAR-001
    - P-011-DSF-001
  work_packet: WP-OMNI-0005
  status: data_model_architecture
  implementation_target:
    first: q3_accessible_xlsx
    later_optional:
      - sqlite
      - postgresql
      - airtable
      - approved_control_tower_database
  governing_law:
    - Quality and Quality Assurance is Job #1
    - No proof, no inventory
    - No certification, no delivery
    - No human approval, no release

claims:
  workbook_implemented: false
  production_database_deployed: false
  live_connectors_configured: false
  autonomous_release: false
  autonomous_minting: false
  autonomous_human_approval: false

principles:
  - stable_ids_never_reused
  - approved_history_not_silently_overwritten
  - privacy_aware_routing_and_export
  - independent_model_lines_until_approved_comparison
  - model_agreement_is_not_source_verification
  - blockchain_hash_is_not_truth_certification
  - q4_minimum_for_approved_inventory
  - red_risk_or_failed_critical_gate_blocks_release
  - human_approval_is_human_only
  - documentation_is_not_deployment
  - corrections_propagate_to_all_affected_targets
  - restricted_evidence_excluded_from_public_prototype

id_prefixes:
  module: MOD-
  program: PRG-
  workstream: WS-
  work_packet: WP-
  continuation_packet: CP-
  decision: DEC-
  artifact: ART-
  source: SRC-
  claim: CLM-
  contradiction: CON-
  requirement: REQ-
  test: TST-
  defect: DEF-
  risk: RSK-
  gate_result: GATE-
  approval: APR-
  product: PROD-
  product_version: VER-
  model_line_edition: ED-
  character: CHAR-
  ecosystem: ECO-
  ceiu: CEIU-
  learning_object: LO-
  skill: SKILL-
  assessment: ASM-
  build_project: BUILD-
  media_asset: MEDIA-
  nft_provenance: NFT-
  offer: OFFER-
  campaign: CAM-
  affiliate: AFF-
  revenue_event: REV-
  cost_event: COST-
  support_event: SUP-
  device: DEV-
  platform: PLAT-
  connector: CONN-
  incident: INC-
  correction: COR-
  retirement: RET-
  franchise_node: NODE-
  audit: AUD-
  archive: ARC-
  audit_event: EVT-
  quality_evidence_packet: QEP-

privacy_classes:
  public:
    public_export: allowed_after_review
    public_ai: allowed_after_review
    broad_slack: allowed_after_review
    nft_metadata: allowed_after_review
    blockchain: allowed_after_review
  internal:
    public_export: blocked
    public_ai: blocked
    broad_slack: blocked
    nft_metadata: blocked
    blockchain: blocked
  confidential:
    public_export: prohibited
    public_ai: prohibited
    broad_slack: prohibited
    nft_metadata: prohibited
    blockchain: prohibited
    access: named_roles_only
  restricted:
    public_export: prohibited
    public_ai: prohibited
    general_ai_chat: prohibited
    broad_slack: prohibited
    public_repository: prohibited
    nft_metadata: prohibited
    blockchain: prohibited
    access: approved_private_vault_only

model_lines:
  independent:
    - chatgpt_business
    - gemini_notebooklm
    - claude_fabric_hermes
  additional:
    - human_editorial
  locked_until_independent_approval:
    - comparison
    - merged_premium
  independence_requirements:
    - separate_work_packet
    - separate_source_manifest
    - independent_first_pass
    - separate_quality_packet
    - copied_output_not_counted_as_independent
    - source_dependence_report_required_before_comparison

truth_labels:
  VF_verified_fact: verified_fact
  OA_official_assessment: official_assessment
  CT_corroborated_testimony: corroborated_testimony
  AL_allegation: allegation
  WH_working_hypothesis: working_hypothesis
  FD_fictional_dramatization: fictional_dramatization
  CX_contradicted: contradicted

certification_levels:
  Q0_idea: 0
  Q1_structured_draft: 1
  Q2_evidence_mapped: 2
  Q3_testable_pilot: 3
  Q4_certified_product: 4
  Q5_production_proven: 5
  Q6_franchise_replicable: 6
  Q7_continuum_stewarded: 7

risk_gate:
  green: eligible_for_ordinary_review
  yellow: conditional_or_limited
  orange: pilot_or_quarantine_only
  red: stop_work_no_release

critical_release_logic:
  minimum_certification: Q4_certified_product
  critical_gates_must_pass: true
  red_risk_prohibited: true
  open_critical_defects_allowed: 0
  human_approval_required: true
  rights_privacy_security_accessibility_required: true
  score_override_prohibited: true

workbook:
  target_file_name: P011_Master_Evidence_Product_Ledger_Q3.xlsx
  sheets:
    - order: 0
      name: 00_README
      purpose: instructions_scope_boundaries_and_navigation
    - order: 1
      name: 01_CURRENT_CHECKPOINT
      purpose: current_packet_next_action_quality_and_blockers
    - order: 2
      name: 02_DASHBOARD
      purpose: executive_operating_dashboard
    - order: 3
      name: 03_MODULES_PROGRAMS
      tables: [Modules, Programs]
    - order: 4
      name: 04_WORKSTREAMS_PACKETS
      tables: [Workstreams, WorkPackets, WorkPacketDependencyLinks]
    - order: 5
      name: 05_CONTINUATION_DECISIONS
      tables: [ContinuationPackets, Decisions, Artifacts]
    - order: 6
      name: 06_PRODUCTS_VERSIONS
      tables: [Products, ProductVersions]
    - order: 7
      name: 07_MODEL_LINE_EDITIONS
      tables: [ModelLineEditions]
    - order: 8
      name: 08_SOURCES_CLAIMS
      tables: [Sources, Claims, ClaimSourceLinks]
    - order: 9
      name: 09_CONTRADICTIONS
      tables: [Contradictions]
    - order: 10
      name: 10_REQUIREMENTS_TESTS
      tables: [Requirements, Tests]
    - order: 11
      name: 11_DEFECTS_RISKS
      tables: [Defects, Risks]
    - order: 12
      name: 12_GATES_APPROVALS
      tables: [GateResults, Approvals, QualityEvidencePackets]
    - order: 13
      name: 13_CHARACTERS_ECOSYSTEMS
      tables: [Characters, Ecosystems]
    - order: 14
      name: 14_CEIUS
      tables: [CEIUs, CEIUEcosystemLinks, ProductCharacterLinks]
    - order: 15
      name: 15_LEARNING_SKILLS
      tables: [LearningObjects, Skills, Assessments, LearningObjectSkillLinks, LearningObjectAssessmentLinks]
    - order: 16
      name: 16_BUILD_MEDIA_NFT
      tables: [BuildProjects, MediaAssets, NFTProvenance]
    - order: 17
      name: 17_OFFERS_CAMPAIGNS
      tables: [Offers, Campaigns, Affiliates, CampaignAffiliateLinks]
    - order: 18
      name: 18_REVENUE_COSTS
      tables: [RevenueEvents, CostEvents, SupportEvents]
    - order: 19
      name: 19_DEVICES_PLATFORMS
      tables: [Devices, Platforms]
    - order: 20
      name: 20_CONNECTORS
      tables: [Connectors, ConnectorWorkPacketLinks]
    - order: 21
      name: 21_INCIDENTS_CORRECTIONS
      tables: [Incidents, Corrections, CorrectionTargets, Retirements]
    - order: 22
      name: 22_FRANCHISE_AUDITS
      tables: [FranchiseNodes, FranchiseNodeProductLinks, Audits]
    - order: 23
      name: 23_ARCHIVE_AUDIT_EVENTS
      tables: [Archives, AuditEvents]
    - order: 24
      name: 24_DATA_DICTIONARY
      purpose: canonical_field_definitions_and_relationships
    - order: 25
      name: 25_ENUMS_VALIDATION
      purpose: validation_lists_and_state_machines
    - order: 26
      name: 26_IMPORT_EXPORT
      purpose: import_export_contract_and_logs
    - order: 27
      name: 27_VERSION_HISTORY
      purpose: workbook_structure_formula_and_correction_history
  mobile_views:
    - MOBILE_CURRENT
    - MOBILE_NEXT_ACTIONS
    - MOBILE_RELEASE_BLOCKS
    - MOBILE_PRODUCT_STATUS
    - MOBILE_INCIDENTS
    - MOBILE_REVENUE_SUMMARY
  accessibility:
    - frozen_headers
    - filters
    - readable_column_widths
    - plain_language_labels
    - instructions_on_each_complex_sheet
    - not_color_alone
    - keyboard_friendly_tables
    - high_contrast_warning_labels

entities:
  Modules:
    primary_key: module_id
    fields: [module_name, module_version, status, parent_module_id, canonical_repository, canonical_path, human_owner, privacy_class, created_at, updated_at, supersedes_module_id, retirement_id]
  Programs:
    primary_key: program_id
    foreign_keys: {module_id: Modules.module_id}
    fields: [program_name, purpose, human_owner, status, priority, privacy_class, start_date, target_date, actual_completion_date]
  Workstreams:
    primary_key: workstream_id
    foreign_keys: {program_id: Programs.program_id}
    fields: [workstream_name, objective, owner, reviewer, status, priority, percent_complete, blocked_reason, current_work_packet_id]
  WorkPackets:
    primary_key: work_packet_id
    foreign_keys: {workstream_id: Workstreams.workstream_id, device_id: Devices.device_id, platform_id: Platforms.platform_id}
    fields: [title, objective, scope_in, scope_out, acceptance_criteria, owner, model_line, privacy_class, status, priority, issue_reference, branch_reference, pull_request_reference, started_at, due_at, completed_at, next_action]
  ContinuationPackets:
    primary_key: continuation_packet_id
    foreign_keys: {work_packet_id: WorkPackets.work_packet_id, device_id: Devices.device_id, platform_id: Platforms.platform_id}
    fields: [packet_version, supersedes_packet_id, status, created_at, human_owner, reviewer, model_line, privacy_class, objective_summary, work_completed_summary, blocker_summary, highest_priority_next_action, resume_prompt, risk_gate, certification_level, human_approval_status, artifact_reference]
  Decisions:
    primary_key: decision_id
    foreign_keys: {work_packet_id: WorkPackets.work_packet_id}
    fields: [decision_text, rationale, evidence_reference, decided_by, decision_date, reversible, review_date, status, superseded_by_decision_id]
  Artifacts:
    primary_key: artifact_id
    foreign_keys: {work_packet_id: WorkPackets.work_packet_id, product_version_id: ProductVersions.product_version_id}
    fields: [artifact_type, title, version, location, repository, branch, commit_sha, content_hash, media_type, privacy_class, rights_status, status, created_by, created_at, approved_by, approved_at, supersedes_artifact_id]
  Sources:
    primary_key: source_id
    fields: [title, author_or_organization, source_type, publication_date, retrieved_at, canonical_reference, primary_or_secondary, authority_score, relevance_score, currency_score, independence_group, rights_status, privacy_class, content_hash, archived_reference, notes]
  Claims:
    primary_key: claim_id
    fields: [claim_text, truth_label, claim_domain, subject, date_context, geographic_context, status, confidence, publication_status, owner, last_verified_at, freshness_due_at, correction_id]
  ClaimSourceLinks:
    primary_key: claim_source_link_id
    foreign_keys: {claim_id: Claims.claim_id, source_id: Sources.source_id}
    fields: [support_type, source_location, evidence_summary, reviewer, reviewed_at]
  Contradictions:
    primary_key: contradiction_id
    fields: [claim_id_a, claim_id_b, source_id_a, source_id_b, contradiction_type, materiality, status, resolution_method, resolution_summary, resolved_by, resolved_at]
  Requirements:
    primary_key: requirement_id
    fields: [work_packet_id, product_version_id, requirement_type, requirement_text, priority, critical, source_reference, acceptance_method, status, owner, due_at]
  Tests:
    primary_key: test_id
    foreign_keys: {requirement_id: Requirements.requirement_id}
    fields: [test_type, test_name, procedure, expected_result, actual_result, status, performed_by, performed_at, evidence_reference, environment, repeatable]
  Defects:
    primary_key: defect_id
    fields: [test_id, artifact_id, product_version_id, severity, title, description, privacy_or_security_impact, status, owner, detected_at, target_fix_date, fixed_at, verification_test_id, release_blocking]
  Risks:
    primary_key: risk_id
    fields: [object_type, object_id, category, description, likelihood, impact, risk_score, risk_gate, mitigation, owner, status, review_due_at, residual_risk, accepted_by]
  GateResults:
    primary_key: gate_result_id
    fields: [object_type, object_id, gate_name, critical, status, evidence_reference, reviewer, reviewed_at, conditions, expires_at, supersedes_gate_result_id]
  Approvals:
    primary_key: approval_id
    fields: [object_type, object_id, approval_type, status, requested_by, requested_at, approver, decided_at, scope, conditions, expires_at, revoked_at, audit_reference]
    constraints:
      - ai_identity_cannot_approve_HumanApprovalGate
  Products:
    primary_key: product_id
    fields: [product_family, product_name, description, product_type, ceiu_id, human_owner, privacy_class, status, current_version_id, inventory_status, franchise_eligible, created_at, retirement_id]
  ProductVersions:
    primary_key: product_version_id
    foreign_keys: {product_id: Products.product_id, quality_packet_id: QualityEvidencePackets.quality_packet_id}
    fields: [version, title, certification_level, risk_gate, status, model_independence_required, source_manifest_reference, release_eligibility, release_block_reason, approved_at, published_at, supersedes_version_id]
  ModelLineEditions:
    primary_key: edition_id
    foreign_keys: {product_version_id: ProductVersions.product_version_id, quality_packet_id: QualityEvidencePackets.quality_packet_id}
    fields: [model_line, edition_type, status, independent_first_pass, source_manifest_reference, working_location, approved_by, approved_at, comparison_eligible, merged_premium_eligible]
  Characters:
