  ArtifactSourceLinks: [link_id, artifact_id, source_id, relationship_type, effective_at, expires_at, status, audit_reference]
  ClaimProductVersionLinks: [link_id, claim_id, product_version_id, relationship_type, effective_at, expires_at, status, audit_reference]
  ProductCharacterLinks: [link_id, product_id, character_id, relationship_type, effective_at, expires_at, status, audit_reference]
  CEIUEcosystemLinks: [link_id, ceiu_id, ecosystem_id, relationship_type, effective_at, expires_at, status, audit_reference]
  LearningObjectSkillLinks: [link_id, learning_object_id, skill_id, relationship_type, effective_at, expires_at, status, audit_reference]
  LearningObjectAssessmentLinks: [link_id, learning_object_id, assessment_id, relationship_type, effective_at, expires_at, status, audit_reference]
  CampaignAffiliateLinks: [link_id, campaign_id, affiliate_id, relationship_type, effective_at, expires_at, status, audit_reference]
  CorrectionTargets: [link_id, correction_id, target_type, target_id, required, status, verified_at, audit_reference]
