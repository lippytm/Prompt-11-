  ConnectorWorkPacketLinks: [link_id, connector_id, work_packet_id, relationship_type, effective_at, expires_at, status, audit_reference]

state_machines:
  work_packet:
    normal: [backlog, ready, active, under_review, completed, archived]
    side: [blocked, cancelled, superseded, quarantined]
  product_ceiu:
    normal: [idea, structured_draft, evidence_mapped, testable_pilot, certified_product, production_proven, franchise_replicable, continuum_stewarded]
    side: [quarantined, suspended, superseded, retired]
  product_version: [draft, under_review, approved, published, paused, withdrawn, superseded, retired]
  model_line_edition: [not_started, researching, drafting, qa, approved, rejected, superseded]
  claim: [captured, sourced, corroborated, contradicted, unresolved, approved_for_publication, blocked, corrected, retired]
  requirement: [proposed, approved, implementing, test_ready, verified, failed, superseded, retired]
  defect: [new, triaged, assigned, fixing, verification, closed, deferred, duplicate, not_reproducible, accepted_risk, reopened]
  risk: [identified, analyzed, mitigating, monitored, accepted, avoided, transferred, escalated, closed]
  gate: [not_started, in_review, pass, conditional, fail, not_applicable, expired, revoked]
  approval: [not_requested, pending, approved, rejected, expired, revoked]
  campaign: [draft, review, approved, scheduled, active, paused, corrected, withdrawn, archived]
  connector: [planned, configured, permission_tested, function_tested, security_reviewed, approved, active, suspended, revoked, retired]
  incident: [detected, triaged, contained, remediating, recovered, closed]
  correction: [proposed, reviewed, approved, propagating, completed, verified, rejected, withdrawn, superseded]
  franchise_node: [N0_proposed, N1_registered, N2_sandbox, N3_pilot, N4_certified, N5_replication_ready, N6_mentor_node, N7_continuum_steward, suspended, quarantined, revoked, retired]

formulas:
  status_score:
    backlog: 0.0
    not_started: 0.0
    ready: 0.1
    active: 0.5
    under_review: 0.85
    completed: 1.0
    approved: 1.0
  weighted_completion: "SUM(weight * status_score) / SUM(active_weight)"
  requirement_coverage: "verified_requirements / approved_active_requirements"
  test_pass_rate: "passed_tests / executed_tests"
  evidence_coverage: "publication_claims_with_reviewed_source / publication_relevant_claims"
  model_independence: "approved_required_independent_editions / required_independent_editions"
  critical_gates_pass: "all_applicable_critical_gates in [pass, not_applicable]"
  release_eligible: "certification>=Q4 AND critical_gates_pass AND risk_gate!=red AND open_critical_defects=0 AND human_approval=approved_in_scope AND rights_privacy_security_accessibility_satisfied"
  overdue_days: "MAX(0, today - due_date)"
  checkpoint_age: "today - current_packet_created_date"
  risk_score: "likelihood * impact"
  correction_propagation: "verified_corrected_targets / required_correction_targets"
  net_revenue: "gross_amount - discount_amount - refund_amount - fee_amount"
  contribution_margin: "net_revenue - direct_variable_costs"
  probability_weighted_forecast: "expected_amount * stated_probability"
  budget_variance: "actual - budget"
  budget_variance_percent: "IF(budget=0, blank, variance/budget)"

quality_score_weights:
  purpose_and_value: 8
  evidence_and_truth: 12
  functional_correctness: 10
  safety_and_abuse_resistance: 10
  privacy_and_identity: 8
  cybersecurity: 8
  rights_legal_medical: 8
  accessibility_and_usability: 8
  environmental_responsibility: 6
  interoperability_and_maintainability: 6
  resilience_and_incident_readiness: 6
  business_and_revenue_integrity: 5
  provenance_correction_retirement: 5

dashboards:
  current_checkpoint:
    - current_packet
    - status
    - module_program_workstream_work_packet
