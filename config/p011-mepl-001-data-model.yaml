  CEIUs:
    primary_key: ceiu_id
    fields: [title, character_id, primary_ecosystem_id, truth_boundary, quantum_questions_reference, learning_summary, story_summary, innovation_summary, business_summary, certification_level, risk_gate, status, entry_passport_reference]
  LearningObjects:
    primary_key: learning_object_id
    fields: [ceiu_id, title, object_type, learning_level, audience, prerequisites, objectives, assessment_summary, accessibility_requirements, estimated_duration, status, version]
  Skills:
    primary_key: skill_id
    fields: [skill_name, domain, level, description, evidence_required, prerequisite_skill_id, status]
  Assessments:
    primary_key: assessment_id
    fields: [learning_object_id, assessment_type, instructions, rubric_reference, passing_rule, attempt_limit, human_review_required, privacy_class, status]
  BuildProjects:
    primary_key: build_project_id
    fields: [ceiu_id, learning_object_id, title, problem, requirements, repository, test_plan, security_review, accessibility_review, environmental_review, status, certification_level]
  MediaAssets:
    primary_key: media_asset_id
    fields: [product_version_id, edition_id, media_type, title, file_or_location, duration_or_length, language, accessibility_assets, rights_status, privacy_class, content_hash, status]
  NFTProvenance:
    primary_key: nft_provenance_id
    fields: [product_version_id, media_asset_id, network, contract_reference, token_or_edition_reference, public_metadata_reference, content_hash, license_reference, correction_reference, mint_status, privacy_review_status, rights_review_status, investment_disclaimer_present]
  Offers:
    primary_key: offer_id
    fields: [product_id, offer_name, customer_problem, value_proposition, scope, exclusions, price_assumption, currency, recurring, support_commitment, refund_policy_reference, claims_review_status, status]
  Campaigns:
    primary_key: campaign_id
    fields: [offer_id, campaign_name, audience, channel, budget, start_date, end_date, status, campaign_passport_reference, truth_and_disclosure_status, accessibility_status, correction_plan, stop_conditions]
  Affiliates:
    primary_key: affiliate_id
    fields: [human_or_business_name, agreement_reference, approved_offers, commission_rule, disclosure_requirement, payment_status, privacy_class, status]
  RevenueEvents:
    primary_key: revenue_event_id
    fields: [product_id, offer_id, campaign_id, affiliate_id, event_date, event_type, quantity, gross_amount, discount_amount, refund_amount, fee_amount, net_amount, currency, payment_status, source_reference, privacy_class]
  CostEvents:
    primary_key: cost_event_id
    fields: [program_id, product_id, campaign_id, event_date, cost_category, vendor_or_platform, amount, currency, recurring, source_reference, privacy_class]
  SupportEvents:
    primary_key: support_event_id
    fields: [product_id, customer_or_learner_reference, event_date, event_type, severity, summary, privacy_class, status, owner, resolution_summary, correction_id]
  Devices:
    primary_key: device_id
    fields: [device_type, owner, business_or_personal, operating_system, encryption_status, update_status, backup_status, restore_tested, mfa_capable, approved_privacy_classes, last_security_review, status]
