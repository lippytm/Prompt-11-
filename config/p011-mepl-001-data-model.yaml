  Platforms:
    primary_key: platform_id
    fields: [platform_name, account_or_workspace_label, human_owner, business_or_personal, primary_role, approved_privacy_classes, recovery_verified, mfa_status, last_permission_review, status]
  Connectors:
    primary_key: connector_id
    fields: [source_platform_id, destination_platform_id, purpose, permission_scope, allowed_data_classes, allowed_actions, prohibited_actions, rate_limit, spend_limit, expiration, revocation_procedure, permission_test_status, functional_test_status, security_test_status, audit_reference, status]
  Incidents:
    primary_key: incident_id
    fields: [detected_at, incident_type, severity, affected_object_type, affected_object_id, privacy_class, summary, status, containment_action, owner, notification_required, recovery_status, root_cause, closed_at]
  Corrections:
    primary_key: correction_id
    fields: [proposed_at, affected_object_type, affected_object_id, materiality, reason, corrected_text_or_action, status, approved_by, approved_at, propagation_scope, propagation_complete_percent, verification_reference, completed_at]
  Retirements:
