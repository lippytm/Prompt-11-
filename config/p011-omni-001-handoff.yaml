release_gates:
  - ContinuationGate
  - SyncGate
  - DeviceSecurityGate
  - PlatformPermissionGate
  - SourceProvenanceGate
  - ModelIndependenceGate
  - ConflictResolutionGate
  - PrivacyRoutingGate
  - AccessibilityGate
  - RightsGate
  - FunctionalGate
  - LearningOutcomeGate
  - BusinessIntegrityGate
  - EnvironmentalGate
  - HumanApprovalGate

risk_gate:
  green: ordinary_review_eligible
  yellow: conditional_or_limited_work
  orange: sandbox_pilot_or_quarantine_only
  red: stop_work_and_no_release

stop_work_triggers:
  - restricted_data_routed_to_unauthorized_destination
  - secret_or_private_key_exposed
  - device_or_account_compromise_suspected
  - model_line_output_mislabeled_as_independent
  - unresolved_edit_conflict_on_release_artifact
  - unsupported_medical_legal_financial_or_earnings_claim
  - rights_or_identity_permission_missing
  - harmful_intrusion_sabotage_evasion_coercion_or_weaponization
  - critical_accessibility_or_safety_defect
  - red_risk_gate
  - human_approval_missing

