module:
  id: P-011-OMNI-001
  name: Omni-Device Multi-AI Broadband Learning, Publishing and Business Continuity Fabric
  version: 0.4.0
  status: architecture
  parent: Prompt-11
  related_modules:
    - P-011-E6C-001
    - P-011-EEBDS-001
    - P-011-E6C-CHAR-001
    - P-011-DSF-001
  governing_law:
    - Quality and Quality Assurance is Job #1
    - No proof, no inventory
    - No certification, no delivery
    - No human approval, no release

purpose:
  - preserve project continuity across devices, platforms and AI model lines
  - support high-variety input and output for education, entertainment and business development
  - teach programming, blockchain development, AI systems, cybersecurity and entrepreneurship
  - preserve privacy, provenance, correction, accessibility and environmental responsibility
  - separate architecture from deployed integrations

canonical_state:
  repository: lippytm/Prompt-11-
  primary_record_types:
    - continuation_packet
    - work_packet
    - decision_record
    - source_manifest
    - quality_evidence_packet
    - product_passport
    - character_passport
    - encyclopedia_entry_passport
    - campaign_passport
    - franchise_node_passport
  conflict_rule: latest_human_approved_record_wins
  deletion_rule: supersede_or_retire_do_not_silently_delete

privacy_classes:
  public:
    allowed_destinations:
      - public_github
      - public_media
      - public_nft_metadata
      - approved_social_channels
  internal:
    allowed_destinations:
      - authorized_workspaces
      - private_github
      - approved_slack_channels
  confidential:
    allowed_destinations:
      - least_privilege_private_vault
      - specifically_authorized_reviewers
  restricted:
    allowed_destinations:
      - approved_private_case_vault_only
    prohibited_destinations:
      - public_github
      - general_ai_chat
      - broad_slack_channels
      - nft_metadata
      - blockchain
      - public_media

truth_labels:
  VF: verified_fact
  OA: official_assessment
  CT: corroborated_testimony
  AL: allegation
  WH: working_hypothesis
  FD: fictional_dramatization
  CX: contradicted

platform_roles:
  iphone:
    role:
      - capture
      - voice_dictation
      - triage
      - quick_review
      - human_approval_when_appropriate
    required_controls:
      - screen_lock
      - device_encryption
      - current_security_updates
      - no_restricted_data_in_general_notes
      - end_session_continuation_packet
  ipad:
    role:
      - visual_review
      - annotation
      - storyboarding
      - accessibility_review
      - presentation_review
    required_controls:
      - conflict_check_before_edit
      - approval_scope_recorded
      - sync_confirmation
  asus_laptop:
    role:
      - coding
      - testing
      - repository_management
      - media_production
      - local_builds
      - backup_verification
    required_controls:
      - secrets_not_committed
      - dependency_and_security_scans
      - tested_restore_procedure
      - branch_and_pull_request_workflow
  zo_computer:
    role:
      - authorized_runtime
      - cloud_workspace
      - scheduled_jobs
      - prototype_deployment
    status_rule: never_assume_connected_until_permission_and_functional_tests_pass
  chatgpt_business:
    model_line: chatgpt
    role:
      - orchestration
      - structured_drafting
      - analysis
      - qa_planning
      - continuation_support
    restrictions:
      - no_automatic_truth_certification
      - no_automatic_external_sync
      - no_human_approval_gate
  gemini_notebooklm:
    model_line: gemini_notebooklm
    role:
      - independent_source_grounded_research
      - notebook_organization
      - source_comparison
      - audio_overview_planning
    restrictions:
      - no_copying_other_model_conclusions_as_independent_work
      - source_manifest_required
  claude_fabric_hermes:
    model_line: claude_hermes
    role:
      - independent_architecture
      - long_context_review
      - contradiction_analysis
      - bounded_work_packet_routing
    restrictions:
      - no_final_truth_or_liability_decisions
      - no_contract_or_financial_authority
      - no_human_approval_gate
  github:
    role:
      - canonical_version_control
      - issues
      - pull_requests
      - schemas
      - manifests
      - audit_trail
      - releases
    restrictions:
      - no_secrets
      - no_private_medical_or_identity_evidence_in_public_repositories
  slack:
    role:
      - collaboration
      - alerts
      - handoff_notifications
      - decision_discussion
    restrictions:
      - does_not_replace_canonical_decision_record
      - no_restricted_data_in_broad_channels
      - link_to_authoritative_artifacts
  nft_blockchain:
    role:
      - public_provenance
      - edition_identity
      - public_license_reference
      - correction_and_supersession_links
    restrictions:
      - hash_does_not_prove_truth
      - no_private_or_restricted_data
      - no_guaranteed_investment_value

continuation_packet:
  schema: schemas/p011-continuation-packet.schema.json
  template: templates/CONTINUATION_PACKET.md
  required_at:
    - end_of_meaningful_session
    - device_change
    - platform_change
    - model_line_handoff
    - workstream_change
    - approval_or_rejection
    - incident_or_correction
  approval_rule: newest_approved_packet_supersedes_but_does_not_delete_older_packets
  universal_resume_command: >-
    Continue Prompt #11 from the latest approved Continuation Packet. Preserve
    model-line independence, privacy classification, source provenance, Quality
    and Quality Assurance as Job #1, and begin with the highest-priority
    unblocked work packet.

work_packet_lifecycle:
  - capture
  - normalize
  - classify
  - route
  - independent_research
  - build
  - test
  - compare
  - quality_assurance
  - human_review
  - release
  - measure
  - correct
  - evolve
  - retire_and_archive

model_line_protocol:
  independent_lines:
    - chatgpt
    - gemini_notebooklm
    - claude_hermes
  comparison_allowed_after:
    - first_pass_complete
    - source_manifest_complete
    - privacy_review_complete
    - internal_qa_complete
  merged_premium_allowed_after:
    - comparison_report_complete
    - contradictions_documented
    - rights_review_complete
    - human_approval_gate_pass
  prohibited:
    - copying_one_model_output_into_another_and_calling_it_independent
    - treating_model_agreement_as_source_verification
    - sharing_restricted_data_without_specific_authorization

